[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  # We omit public Firebase keys from scanning because they are required to be in the client bundle.
  # GEMINI_API_KEY must NOT be listed here as it should be kept secret and used only via the proxy.
  SECRETS_SCAN_OMIT_KEYS = "VITE_FIREBASE_API_KEY,VITE_FIREBASE_APP_ID,VITE_FIREBASE_PROJECT_ID,VITE_FIREBASE_AUTH_DOMAIN,VITE_FIREBASE_STORAGE_BUCKET,VITE_FIREBASE_MESSAGING_SENDER_ID,VITE_FIREBASE_DATABASE_ID"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
